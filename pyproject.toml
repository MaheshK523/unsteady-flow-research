[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "unsteady-flow-toolkit"
version = "1.0.0"
description = "Reduced-order unsteady-flow and aeroacoustic signal analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "matplotlib>=3.8,<4"]

[project.scripts]
unsteady-flow = "unsteady_flow.cli:main"

[tool.setuptools.packages.find]
include = ["unsteady_flow*"]
